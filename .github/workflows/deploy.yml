name: Deploy

on:
  push:
    branches:
      - main
      - "**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 963d455e7eb8b204fb11b22b7dd02cd1
          command: ${{ github.ref == 'refs/heads/main' && 'deploy --env production' || 'deploy' }}
