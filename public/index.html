<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>边缘上线</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1410'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff6a3d'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #1a1410;
        --ink: #f4ece4;
        --muted: #b8a99a;
        --accent: #ff6a3d;
        --line: rgba(244, 236, 228, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(1200px 500px at 10% -10%, rgba(255, 106, 61, 0.18), transparent 55%),
          radial-gradient(900px 400px at 100% 0%, rgba(126, 200, 163, 0.12), transparent 50%),
          var(--bg);
        color: var(--ink);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .card {
        width: min(560px, 100%);
        padding: 36px 32px 28px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(42, 34, 28, 0.72);
        backdrop-filter: blur(16px);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 22px;
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7ec8a3;
        box-shadow: 0 0 0 6px rgba(126, 200, 163, 0.16);
        animation: pulse 2.4s ease-out infinite;
      }

      h1 {
        margin: 0 0 10px;
        font-family: Georgia, "Songti SC", "Noto Serif SC", serif;
        font-size: clamp(36px, 8vw, 52px);
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .lead {
        margin: 0 0 28px;
        color: var(--muted);
        line-height: 1.7;
        font-size: 16px;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        background: var(--accent);
        color: #1a1410;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.06);
      }

      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      .result {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
        min-height: 4.5em;
      }

      .result strong {
        color: var(--ink);
        font-weight: 600;
      }

      .error {
        color: #ffb4a2;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(126, 200, 163, 0.35);
        }
        100% {
          box-shadow: 0 0 0 12px rgba(126, 200, 163, 0);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <div class="status"><span class="dot"></span> Cloudflare 已上线</div>
        <h1>边缘上线</h1>
        <p class="lead">这是一个发布在 Cloudflare 上的小站点。点一下按钮，看看请求打到了哪座边缘节点。</p>
        <button id="ping" type="button">探测节点</button>
        <div class="result" id="result">还没有探测。点按钮后会显示节点、城市和时间。</div>
      </section>
    </main>
    <script>
      const button = document.getElementById("ping");
      const result = document.getElementById("result");

      button.addEventListener("click", async () => {
        button.disabled = true;
        result.textContent = "正在探测边缘节点…";
        result.classList.remove("error");

        try {
          const response = await fetch("/api/hello");
          if (!response.ok) throw new Error("接口返回 " + response.status);
          const data = await response.json();
          const where = [data.city, data.country].filter(Boolean).join(" · ") || "未知位置";
          result.innerHTML =
            "<strong>" +
            data.message +
            "</strong><br>节点 " +
            data.colo +
            " · " +
            where +
            "<br>" +
            new Date(data.time).toLocaleString("zh-CN", { hour12: false });
        } catch (error) {
          result.classList.add("error");
          result.textContent = "探测失败：" + error.message;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
