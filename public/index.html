<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>今日一句</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1410'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff6a3d'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #1a1410;
        --ink: #f4ece4;
        --muted: #b8a99a;
        --accent: #ff6a3d;
        --line: rgba(244, 236, 228, 0.12);
        --card: rgba(42, 34, 28, 0.72);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(1200px 500px at 10% -10%, rgba(255, 106, 61, 0.18), transparent 55%),
          radial-gradient(900px 400px at 100% 0%, rgba(126, 200, 163, 0.12), transparent 50%),
          var(--bg);
        color: var(--ink);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding: 32px 20px 64px;
      }

      .wrap {
        width: min(640px, 100%);
      }

      .card {
        padding: 32px 28px 24px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--card);
        backdrop-filter: blur(16px);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 18px;
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7ec8a3;
        box-shadow: 0 0 0 6px rgba(126, 200, 163, 0.16);
        animation: pulse 2.4s ease-out infinite;
      }

      h1 {
        margin: 0 0 8px;
        font-family: Georgia, "Songti SC", "Noto Serif SC", serif;
        font-size: clamp(32px, 7vw, 48px);
        font-weight: 600;
      }

      .lead, .hint, .count, .date, .status-msg {
        color: var(--muted);
        line-height: 1.7;
      }

      .lead { margin: 0 0 22px; }

      .date {
        margin: 0 0 14px;
        font-size: 14px;
      }

      textarea {
        width: 100%;
        min-height: 120px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px 16px;
        background: rgba(26, 20, 16, 0.55);
        color: var(--ink);
        font: inherit;
        line-height: 1.7;
      }

      textarea:focus {
        outline: 2px solid rgba(255, 106, 61, 0.45);
        outline-offset: 1px;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-top: 14px;
      }

      button, .file-btn {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 11px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button.primary, .file-btn {
        background: var(--accent);
        color: #1a1410;
      }

      button.ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      button:hover, .file-btn:hover { filter: brightness(1.06); }

      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      .file-btn input {
        display: none;
      }

      .count { margin-left: auto; font-size: 13px; }

      .photo-box {
        margin-top: 18px;
        display: none;
      }

      .photo-box.show { display: block; }

      .photo-box img {
        display: block;
        width: 100%;
        max-height: 360px;
        object-fit: cover;
        border-radius: 18px;
        border: 1px solid var(--line);
      }

      .status-msg {
        min-height: 1.5em;
        margin: 12px 0 0;
        font-size: 14px;
      }

      .status-msg.error { color: #ffb4a2; }

      .gate-form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .gate-form input {
        flex: 1;
        min-width: 180px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 12px 16px;
        background: rgba(26, 20, 16, 0.55);
        color: var(--ink);
        font: inherit;
      }

      .history {
        margin-top: 28px;
      }

      .history h2 {
        margin: 0 0 14px;
        font-size: 16px;
        font-weight: 600;
        color: var(--muted);
      }

      .entry {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 14px;
        padding: 14px 0;
        border-top: 1px solid var(--line);
      }

      .entry img, .entry .no-photo {
        width: 88px;
        height: 88px;
        border-radius: 16px;
        object-fit: cover;
        border: 1px solid var(--line);
      }

      .entry .no-photo {
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 12px;
        background: rgba(26, 20, 16, 0.45);
      }

      .entry .meta {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .entry p {
        margin: 0;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .empty {
        color: var(--muted);
        padding: 8px 0 0;
      }

      .hidden { display: none !important; }

      .top-actions {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 10px;
      }

      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(126, 200, 163, 0.35); }
        100% { box-shadow: 0 0 0 12px rgba(126, 200, 163, 0); }
      }

      @media (max-width: 520px) {
        .entry { grid-template-columns: 72px 1fr; }
        .entry img, .entry .no-photo { width: 72px; height: 72px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="wrap">
        <section class="card" id="gate">
          <div class="status"><span class="dot"></span> 私人日记</div>
          <h1>今日一句</h1>
          <p class="lead">每天留下最想说的一句话，或者一张照片。输入访问码后开始记录。</p>
          <form class="gate-form" id="login-form">
            <input id="code" type="password" name="code" autocomplete="current-password" placeholder="访问码" />
            <button class="primary" type="submit">进入</button>
          </form>
          <p class="status-msg" id="gate-msg"></p>
        </section>

        <section id="app" class="hidden">
          <div class="top-actions">
            <button class="ghost" id="logout" type="button">离开</button>
          </div>
          <section class="card">
            <div class="status"><span class="dot"></span> 今天记下</div>
            <h1>今日一句</h1>
            <p class="date" id="today-label"></p>
            <p class="lead">一句话、一张照片，或者两个都留。每天只会保存这一条。</p>
            <textarea id="sentence" maxlength="500" placeholder="今天最想说的一句话…"></textarea>
            <div class="row">
              <button class="primary" id="save" type="button">保存这句话</button>
              <label class="file-btn">
                选一张照片
                <input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif" />
              </label>
              <label class="file-btn">
                拍一张
                <input id="camera" type="file" accept="image/*" capture="environment" />
              </label>
              <button class="ghost hidden" id="remove-photo" type="button">去掉照片</button>
              <span class="count" id="count">0 / 500</span>
            </div>
            <div class="photo-box" id="photo-box">
              <img id="preview" alt="今天的照片" />
            </div>
            <p class="status-msg" id="app-msg"></p>
          </section>
          <section class="history">
            <h2>以前记下的</h2>
            <div id="history"></div>
          </section>
        </section>
      </div>
    </main>
    <script>
      const gate = document.getElementById("gate");
      const app = document.getElementById("app");
      const sentence = document.getElementById("sentence");
      const count = document.getElementById("count");
      const preview = document.getElementById("preview");
      const photoBox = document.getElementById("photo-box");
      const removePhoto = document.getElementById("remove-photo");
      const gateMsg = document.getElementById("gate-msg");
      const appMsg = document.getElementById("app-msg");
      const history = document.getElementById("history");
      const todayLabel = document.getElementById("today-label");

      const jsonHeaders = { "Content-Type": "application/json" };

      function setMsg(el, text, isError) {
        el.textContent = text || "";
        el.classList.toggle("error", Boolean(isError));
      }

      function formatDay(day) {
        return new Date(day + "T12:00:00+08:00").toLocaleDateString("zh-CN", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
          timeZone: "Asia/Shanghai",
        });
      }

      function updateCount() {
        count.textContent = sentence.value.length + " / 500";
      }

      async function api(url, options) {
        const response = await fetch(url, { credentials: "same-origin", ...options });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const error = new Error(data.error || "请求失败");
          error.status = response.status;
          throw error;
        }
        return data;
      }

      function render(state) {
        todayLabel.textContent = formatDay(state.day);
        sentence.value = state.today?.sentence || "";
        updateCount();

        if (state.today?.hasPhoto) {
          preview.src = "/api/photo/" + state.day + "?t=" + Date.now();
          photoBox.classList.add("show");
          removePhoto.classList.remove("hidden");
        } else {
          preview.removeAttribute("src");
          photoBox.classList.remove("show");
          removePhoto.classList.add("hidden");
        }

        history.replaceChildren();
        const rows = state.entries || [];
        if (!rows.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "还没有记录。从今天开始吧。";
          history.append(empty);
          return;
        }

        for (const entry of rows) {
          const item = document.createElement("article");
          item.className = "entry";

          if (entry.hasPhoto) {
            const img = document.createElement("img");
            img.alt = entry.day + " 的照片";
            img.src = "/api/photo/" + entry.day;
            item.append(img);
          } else {
            const placeholder = document.createElement("div");
            placeholder.className = "no-photo";
            placeholder.textContent = "无照片";
            item.append(placeholder);
          }

          const body = document.createElement("div");
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = formatDay(entry.day);
          const text = document.createElement("p");
          text.textContent = entry.sentence || "这一天只留了照片。";
          body.append(meta, text);
          item.append(body);
          history.append(item);
        }
      }

      async function loadState() {
        const state = await api("/api/state");
        gate.classList.add("hidden");
        app.classList.remove("hidden");
        render(state);
        return state;
      }

      async function compressImage(file) {
        if (!file.type.startsWith("image/") || file.type === "image/gif") return file;
        const bitmap = await createImageBitmap(file);
        const max = 1600;
        const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
        if (scale === 1 && file.size < 1024 * 1024) return file;
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.85));
        return blob || file;
      }

      async function uploadPhoto(file) {
        setMsg(appMsg, "正在保存照片…");
        const prepared = await compressImage(file);
        const form = new FormData();
        form.append("file", prepared, file.name || "photo.jpg");
        const state = await api("/api/photo", { method: "POST", body: form });
        render(state);
        setMsg(appMsg, "照片已记下。");
      }

      document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = event.target.querySelector("button");
        button.disabled = true;
        setMsg(gateMsg, "");
        try {
          await api("/api/login", {
            method: "POST",
            headers: jsonHeaders,
            body: JSON.stringify({ code: document.getElementById("code").value }),
          });
          await loadState();
        } catch (error) {
          setMsg(gateMsg, error.message, true);
        } finally {
          button.disabled = false;
        }
      });

      document.getElementById("save").addEventListener("click", async () => {
        const button = document.getElementById("save");
        button.disabled = true;
        setMsg(appMsg, "正在保存…");
        try {
          const state = await api("/api/sentence", {
            method: "PUT",
            headers: jsonHeaders,
            body: JSON.stringify({ sentence: sentence.value }),
          });
          render(state);
          setMsg(appMsg, "这句话已记下。");
        } catch (error) {
          setMsg(appMsg, error.message, true);
        } finally {
          button.disabled = false;
        }
      });

      async function onPick(event) {
        const file = event.target.files && event.target.files[0];
        event.target.value = "";
        if (!file) return;
        try {
          await uploadPhoto(file);
        } catch (error) {
          setMsg(appMsg, error.message, true);
        }
      }

      document.getElementById("photo").addEventListener("change", onPick);
      document.getElementById("camera").addEventListener("change", onPick);

      removePhoto.addEventListener("click", async () => {
        removePhoto.disabled = true;
        try {
          const state = await api("/api/photo", { method: "DELETE" });
          render(state);
          setMsg(appMsg, "今天的照片已去掉。");
        } catch (error) {
          setMsg(appMsg, error.message, true);
        } finally {
          removePhoto.disabled = false;
        }
      });

      document.getElementById("logout").addEventListener("click", async () => {
        await api("/api/logout", { method: "POST" });
        app.classList.add("hidden");
        gate.classList.remove("hidden");
        document.getElementById("code").value = "";
        setMsg(gateMsg, "");
      });

      sentence.addEventListener("input", updateCount);
      updateCount();

      loadState().catch((error) => {
        if (error.status !== 401) setMsg(gateMsg, error.message, true);
      });
    </script>
  </body>
</html>
