<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>今日一句</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1410'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff6a3d'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #1a1410;
        --ink: #f4ece4;
        --muted: #b8a99a;
        --accent: #ff6a3d;
        --line: rgba(244, 236, 228, 0.12);
        --card: rgba(42, 34, 28, 0.72);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(1200px 500px at 10% -10%, rgba(255, 106, 61, 0.18), transparent 55%),
          radial-gradient(900px 400px at 100% 0%, rgba(126, 200, 163, 0.12), transparent 50%),
          var(--bg);
        color: var(--ink);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding: 32px 20px 64px;
      }

      .wrap {
        width: min(640px, 100%);
      }

      .card {
        padding: 32px 28px 24px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--card);
        backdrop-filter: blur(16px);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 18px;
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7ec8a3;
        box-shadow: 0 0 0 6px rgba(126, 200, 163, 0.16);
        animation: pulse 2.4s ease-out infinite;
      }

      h1 {
        margin: 0 0 8px;
        font-family: Georgia, "Songti SC", "Noto Serif SC", serif;
        font-size: clamp(32px, 7vw, 48px);
        font-weight: 600;
      }

      .lead, .hint, .count, .date, .status-msg {
        color: var(--muted);
        line-height: 1.7;
      }

      .lead { margin: 0 0 22px; }

      .date {
        margin: 0 0 14px;
        font-size: 14px;
      }

      textarea {
        width: 100%;
        min-height: 120px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px 16px;
        background: rgba(26, 20, 16, 0.55);
        color: var(--ink);
        font: inherit;
        line-height: 1.7;
      }

      textarea:focus {
        outline: 2px solid rgba(255, 106, 61, 0.45);
        outline-offset: 1px;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-top: 14px;
      }

      button, .file-btn {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 11px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button.primary, .file-btn {
        background: var(--accent);
        color: #1a1410;
      }

      button.ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      button:hover, .file-btn:hover { filter: brightness(1.06); }

      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      .file-btn input {
        display: none;
      }

      .count { margin-left: auto; font-size: 13px; }

      .photo-box {
        margin-top: 18px;
        display: none;
      }

      .photo-box.show { display: block; }

      .photo-box img {
        display: block;
        width: 100%;
        max-height: 360px;
        object-fit: cover;
        border-radius: 18px;
        border: 1px solid var(--line);
      }

      .status-msg {
        min-height: 1.5em;
        margin: 12px 0 0;
        font-size: 14px;
      }

      .status-msg.error { color: #ffb4a2; }

      .gate-form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .gate-form input {
        flex: 1;
        min-width: 180px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 12px 16px;
        background: rgba(26, 20, 16, 0.55);
        color: var(--ink);
        font: inherit;
      }

      .history {
        margin-top: 28px;
      }

      .history h2 {
        margin: 0 0 14px;
        font-size: 16px;
        font-weight: 600;
        color: var(--muted);
      }

      .entry {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 14px;
        padding: 14px 0;
        border-top: 1px solid var(--line);
      }

      .entry img, .entry .no-photo {
        width: 88px;
        height: 88px;
        border-radius: 16px;
        object-fit: cover;
        border: 1px solid var(--line);
      }

      .entry .no-photo {
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 12px;
        background: rgba(26, 20, 16, 0.45);
      }

      .entry .meta {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .entry p {
        margin: 0;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .empty {
        color: var(--muted);
        padding: 8px 0 0;
      }

      .hidden { display: none !important; }

      .top-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }

      .tabs {
        display: flex;
        gap: 8px;
      }

      .tabs button[aria-selected="true"] {
        background: var(--accent);
        color: #1a1410;
        border-color: transparent;
      }

      .vocab-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        align-items: center;
        margin-bottom: 16px;
        color: var(--muted);
        font-size: 14px;
      }

      .vocab-meta label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .vocab-meta select {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 10px;
        background: rgba(26, 20, 16, 0.55);
        color: var(--ink);
        font: inherit;
      }

      .word-card {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }

      .word-card.done {
        opacity: 0.72;
      }

      .word-head {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: baseline;
      }

      .word-head strong,
      .speak-word {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 28px;
        font-weight: 600;
        cursor: pointer;
        border: 0;
        padding: 0;
        background: none;
        color: inherit;
        text-align: left;
      }

      .speak-word {
        border-radius: 4px;
      }

      .speak-ipa {
        font-size: 13px;
        font-weight: 500;
        padding: 4px 10px;
        color: var(--muted);
      }

      .speak-word:hover,
      .passage.speak:hover,
      .passage mark:hover {
        color: var(--accent);
        filter: none;
      }

      .passage-wrap {
        margin-top: 10px;
        padding: 12px 14px;
        border-radius: 16px;
        background: rgba(26, 20, 16, 0.45);
      }

      .passage.speak {
        display: block;
        width: 100%;
        margin: 0;
        border: 0;
        border-radius: 0;
        padding: 0;
        font: inherit;
        font-weight: 400;
        text-align: left;
        color: inherit;
        background: transparent;
        cursor: pointer;
      }

      .passage-zh {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .tag {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .word-card p {
        margin: 8px 0 0;
        line-height: 1.7;
        color: var(--muted);
      }

      .word-card p.meaning,
      .word-card .passage {
        color: var(--ink);
      }

      .passage {
        line-height: 1.75;
      }

      .passage mark {
        background: rgba(255, 106, 61, 0.28);
        color: inherit;
        padding: 0 2px;
        border-radius: 4px;
        cursor: pointer;
      }

      .grades {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .grades button {
        font-size: 13px;
        padding: 8px 12px;
      }

      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(126, 200, 163, 0.35); }
        100% { box-shadow: 0 0 0 12px rgba(126, 200, 163, 0); }
      }

      @media (max-width: 520px) {
        .entry { grid-template-columns: 72px 1fr; }
        .entry img, .entry .no-photo { width: 72px; height: 72px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="wrap">
        <section class="card" id="gate">
          <div class="status"><span class="dot"></span> 私人日记</div>
          <h1>今日一句</h1>
          <p class="lead">每天留下最想说的一句话，或者一张照片。输入访问码后开始记录。</p>
          <form class="gate-form" id="login-form">
            <input id="code" type="password" name="code" autocomplete="current-password" placeholder="访问码" />
            <button class="primary" type="submit">进入</button>
          </form>
          <p class="status-msg" id="gate-msg"></p>
        </section>

        <section id="app" class="hidden">
          <div class="top-actions">
            <div class="tabs">
              <button class="ghost" id="tab-vocab" type="button" aria-selected="true">单词</button>
              <button class="ghost" id="tab-diary" type="button" aria-selected="false">日记</button>
            </div>
            <button class="ghost" id="logout" type="button">离开</button>
          </div>
          <section class="card" id="panel-vocab">
            <div class="status"><span class="dot"></span> 遗忘曲线</div>
            <h1>今日单词</h1>
            <p class="date" id="vocab-date"></p>
            <p class="lead">财务与信息化英文。每天推送新词和到期复习。点单词听发音，点语境句子听整句；句子下面有中文翻译。</p>
            <div class="vocab-meta">
              <label>
                每周新词
                <select id="weekly-new">
                  <option value="10">10</option>
                  <option value="15">15</option>
                  <option value="20" selected>20</option>
                  <option value="25">25</option>
                  <option value="30">30</option>
                  <option value="40">40</option>
                </select>
              </label>
              <span id="vocab-stats"></span>
            </div>
            <h2 class="history" style="margin: 8px 0 0; font-size: 16px;">今天新学</h2>
            <div id="new-words"></div>
            <h2 class="history" style="margin: 22px 0 0; font-size: 16px;">今天复习</h2>
            <div id="review-words"></div>
            <p class="status-msg" id="vocab-msg"></p>
          </section>
          <section class="card hidden" id="panel-diary">
            <div class="status"><span class="dot"></span> 今天记下</div>
            <h1>今日一句</h1>
            <p class="date" id="today-label"></p>
            <p class="lead">一句话、一张照片，或者两个都留。每天只会保存这一条。</p>
            <textarea id="sentence" maxlength="500" placeholder="今天最想说的一句话…"></textarea>
            <div class="row">
              <button class="primary" id="save" type="button">保存这句话</button>
              <label class="file-btn">
                选一张照片
                <input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif" />
              </label>
              <label class="file-btn">
                拍一张
                <input id="camera" type="file" accept="image/*" capture="environment" />
              </label>
              <button class="ghost hidden" id="remove-photo" type="button">去掉照片</button>
              <span class="count" id="count">0 / 500</span>
            </div>
            <div class="photo-box" id="photo-box">
              <img id="preview" alt="今天的照片" />
            </div>
            <p class="status-msg" id="app-msg"></p>
          </section>
          <section class="history hidden" id="panel-history">
            <h2>以前记下的</h2>
            <div id="history"></div>
          </section>
        </section>
      </div>
    </main>
    <script>
      const gate = document.getElementById("gate");
      const app = document.getElementById("app");
      const sentence = document.getElementById("sentence");
      const count = document.getElementById("count");
      const preview = document.getElementById("preview");
      const photoBox = document.getElementById("photo-box");
      const removePhoto = document.getElementById("remove-photo");
      const gateMsg = document.getElementById("gate-msg");
      const appMsg = document.getElementById("app-msg");
      const history = document.getElementById("history");
      const todayLabel = document.getElementById("today-label");
      const vocabDate = document.getElementById("vocab-date");
      const vocabStats = document.getElementById("vocab-stats");
      const vocabMsg = document.getElementById("vocab-msg");
      const weeklyNew = document.getElementById("weekly-new");
      const newWords = document.getElementById("new-words");
      const reviewWords = document.getElementById("review-words");
      const panelVocab = document.getElementById("panel-vocab");
      const panelDiary = document.getElementById("panel-diary");
      const panelHistory = document.getElementById("panel-history");
      const tabVocab = document.getElementById("tab-vocab");
      const tabDiary = document.getElementById("tab-diary");

      const jsonHeaders = { "Content-Type": "application/json" };

      function setMsg(el, text, isError) {
        el.textContent = text || "";
        el.classList.toggle("error", Boolean(isError));
      }

      function formatDay(day) {
        return new Date(day + "T12:00:00+08:00").toLocaleDateString("zh-CN", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
          timeZone: "Asia/Shanghai",
        });
      }

      function updateCount() {
        count.textContent = sentence.value.length + " / 500";
      }

      async function api(url, options) {
        const response = await fetch(url, { credentials: "same-origin", ...options });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const error = new Error(data.error || "请求失败");
          error.status = response.status;
          throw error;
        }
        return data;
      }

      function render(state) {
        todayLabel.textContent = formatDay(state.day);
        sentence.value = state.today?.sentence || "";
        updateCount();

        if (state.today?.hasPhoto) {
          preview.src = "/api/photo/" + state.day + "?t=" + Date.now();
          photoBox.classList.add("show");
          removePhoto.classList.remove("hidden");
        } else {
          preview.removeAttribute("src");
          photoBox.classList.remove("show");
          removePhoto.classList.add("hidden");
        }

        history.replaceChildren();
        const rows = state.entries || [];
        if (!rows.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "还没有记录。从今天开始吧。";
          history.append(empty);
          return;
        }

        for (const entry of rows) {
          const item = document.createElement("article");
          item.className = "entry";

          if (entry.hasPhoto) {
            const img = document.createElement("img");
            img.alt = entry.day + " 的照片";
            img.src = "/api/photo/" + entry.day;
            item.append(img);
          } else {
            const placeholder = document.createElement("div");
            placeholder.className = "no-photo";
            placeholder.textContent = "无照片";
            item.append(placeholder);
          }

          const body = document.createElement("div");
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = formatDay(entry.day);
          const text = document.createElement("p");
          text.textContent = entry.sentence || "这一天只留了照片。";
          body.append(meta, text);
          item.append(body);
          history.append(item);
        }
      }

      async function loadState() {
        const state = await api("/api/state");
        gate.classList.add("hidden");
        app.classList.remove("hidden");
        render(state);
        await loadVocab();
        return state;
      }

      function showTab(name) {
        const vocab = name === "vocab";
        tabVocab.setAttribute("aria-selected", vocab ? "true" : "false");
        tabDiary.setAttribute("aria-selected", vocab ? "false" : "true");
        panelVocab.classList.toggle("hidden", !vocab);
        panelDiary.classList.toggle("hidden", vocab);
        panelHistory.classList.toggle("hidden", vocab);
      }

      function kindLabel(kind) {
        if (kind === "news") return "新闻语境";
        if (kind === "speech") return "演讲语境";
        return "故事语境";
      }

      function topicLabel(topic) {
        return topic === "finance" ? "财务" : "信息化";
      }

      function pickEnglishVoice() {
        const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
        return (
          voices.find((voice) => /^en(-|_|$)/i.test(voice.lang) && /Google|Microsoft|Samantha|Daniel|Jenny/i.test(voice.name)) ||
          voices.find((voice) => /^en-US/i.test(voice.lang)) ||
          voices.find((voice) => /^en/i.test(voice.lang)) ||
          null
        );
      }

      function speakEnglish(text) {
        const value = String(text || "").trim();
        if (!value) return;
        if (!window.speechSynthesis) {
          setMsg(vocabMsg, "当前浏览器不支持朗读，可换 Chrome 或 Edge。", true);
          return;
        }
        speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(value);
        utter.lang = "en-US";
        utter.rate = 0.92;
        const voice = pickEnglishVoice();
        if (voice) utter.voice = voice;
        speechSynthesis.speak(utter);
      }

      if (window.speechSynthesis) {
        speechSynthesis.getVoices();
        speechSynthesis.addEventListener("voiceschanged", pickEnglishVoice);
      }

      function highlight(text, term) {
        const fragment = document.createDocumentFragment();
        const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const parts = text.split(new RegExp("(" + escaped + ")", "ig"));
        for (const part of parts) {
          if (part.toLowerCase() === term.toLowerCase()) {
            const mark = document.createElement("mark");
            mark.textContent = part;
            mark.title = "点击朗读单词";
            mark.addEventListener("click", (event) => {
              event.stopPropagation();
              speakEnglish(term);
            });
            fragment.append(mark);
          } else {
            fragment.append(part);
          }
        }
        return fragment;
      }

      function wordCard(word, mode) {
        const card = document.createElement("article");
        card.className = "word-card" + (word.done ? " done" : "");

        const head = document.createElement("div");
        head.className = "word-head";
        const title = document.createElement("button");
        title.type = "button";
        title.className = "speak-word";
        title.textContent = word.term;
        title.title = "点击朗读单词";
        title.addEventListener("click", () => speakEnglish(word.term));
        const phonetic = document.createElement("button");
        phonetic.type = "button";
        phonetic.className = "ghost speak-ipa";
        phonetic.textContent = word.phonetic || "听";
        phonetic.title = "点击朗读单词";
        phonetic.addEventListener("click", () => speakEnglish(word.term));
        const pos = document.createElement("span");
        pos.className = "tag";
        pos.textContent = word.pos || "";
        const topic = document.createElement("span");
        topic.className = "tag";
        topic.textContent = topicLabel(word.topic);
        head.append(title, phonetic, pos, topic);

        const meaning = document.createElement("p");
        meaning.className = "meaning";
        meaning.textContent = word.meaning;

        const grammar = document.createElement("p");
        grammar.textContent = "语法：" + (word.grammar || "");

        const context = document.createElement("p");
        context.textContent = kindLabel(word.contextKind) + " · " + (word.contextTitle || "");

        const passageWrap = document.createElement("div");
        passageWrap.className = "passage-wrap";
        const passage = document.createElement("button");
        passage.type = "button";
        passage.className = "passage speak";
        passage.title = "点击朗读整句";
        passage.append(highlight(word.contextBody || "", word.term));
        passage.addEventListener("click", () => speakEnglish(word.contextBody));
        passageWrap.append(passage);
        if (word.contextZh) {
          const zh = document.createElement("p");
          zh.className = "passage-zh";
          zh.textContent = word.contextZh;
          passageWrap.append(zh);
        }

        card.append(head, meaning, grammar, context, passageWrap);

        if (!word.done) {
          const grades = document.createElement("div");
          grades.className = "grades";
          const options = [
            ["again", "没记住"],
            ["hard", "有印象"],
            ["good", "记住了"],
            ["easy", "很熟"],
          ];
          for (const [grade, label] of options) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = grade === "good" ? "primary" : "ghost";
            button.textContent = label;
            button.addEventListener("click", () => gradeWord(word.id, grade));
            grades.append(button);
          }
          card.append(grades);
        } else {
          const done = document.createElement("p");
          done.textContent = mode === "new" ? "今天已学，下次按遗忘曲线再出现。" : "今天已复习。";
          card.append(done);
        }
        return card;
      }

      function renderVocab(data) {
        vocabDate.textContent = formatDay(data.day);
        weeklyNew.value = String(data.weeklyNew);
        vocabStats.textContent =
          "本周已学 " +
          data.introducedThisWeek +
          " / " +
          data.weeklyNew +
          " · 词库 " +
          data.bankSize +
          " 个";

        newWords.replaceChildren();
        if (!data.newWords.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "今天没有新词，或本周额度已经用完。";
          newWords.append(empty);
        } else {
          for (const word of data.newWords) newWords.append(wordCard(word, "new"));
        }

        reviewWords.replaceChildren();
        if (!data.reviewWords.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "今天没有到期复习。坚持几天后，这里会按 1、2、4、7 天出现。";
          reviewWords.append(empty);
        } else {
          for (const word of data.reviewWords) reviewWords.append(wordCard(word, "review"));
        }
      }

      async function loadVocab() {
        const data = await api("/api/vocab");
        renderVocab(data);
        return data;
      }

      async function gradeWord(wordId, grade) {
        setMsg(vocabMsg, "正在记下复习结果…");
        try {
          const data = await api("/api/vocab/review", {
            method: "POST",
            headers: jsonHeaders,
            body: JSON.stringify({ wordId, grade }),
          });
          renderVocab(data);
          setMsg(vocabMsg, "已按遗忘曲线安排下次出现。");
        } catch (error) {
          setMsg(vocabMsg, error.message, true);
        }
      }

      async function compressImage(file) {
        if (!file.type.startsWith("image/") || file.type === "image/gif") return file;
        const bitmap = await createImageBitmap(file);
        const max = 1600;
        const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
        if (scale === 1 && file.size < 1024 * 1024) return file;
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.85));
        return blob || file;
      }

      async function uploadPhoto(file) {
        setMsg(appMsg, "正在保存照片…");
        const prepared = await compressImage(file);
        const form = new FormData();
        form.append("file", prepared, file.name || "photo.jpg");
        const state = await api("/api/photo", { method: "POST", body: form });
        render(state);
        setMsg(appMsg, "照片已记下。");
      }

      document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = event.target.querySelector("button");
        button.disabled = true;
        setMsg(gateMsg, "");
        try {
          await api("/api/login", {
            method: "POST",
            headers: jsonHeaders,
            body: JSON.stringify({ code: document.getElementById("code").value }),
          });
          await loadState();
        } catch (error) {
          setMsg(gateMsg, error.message, true);
        } finally {
          button.disabled = false;
        }
      });

      document.getElementById("save").addEventListener("click", async () => {
        const button = document.getElementById("save");
        button.disabled = true;
        setMsg(appMsg, "正在保存…");
        try {
          const state = await api("/api/sentence", {
            method: "PUT",
            headers: jsonHeaders,
            body: JSON.stringify({ sentence: sentence.value }),
          });
          render(state);
          setMsg(appMsg, "这句话已记下。");
        } catch (error) {
          setMsg(appMsg, error.message, true);
        } finally {
          button.disabled = false;
        }
      });

      async function onPick(event) {
        const file = event.target.files && event.target.files[0];
        event.target.value = "";
        if (!file) return;
        try {
          await uploadPhoto(file);
        } catch (error) {
          setMsg(appMsg, error.message, true);
        }
      }

      document.getElementById("photo").addEventListener("change", onPick);
      document.getElementById("camera").addEventListener("change", onPick);

      removePhoto.addEventListener("click", async () => {
        removePhoto.disabled = true;
        try {
          const state = await api("/api/photo", { method: "DELETE" });
          render(state);
          setMsg(appMsg, "今天的照片已去掉。");
        } catch (error) {
          setMsg(appMsg, error.message, true);
        } finally {
          removePhoto.disabled = false;
        }
      });

      document.getElementById("logout").addEventListener("click", async () => {
        await api("/api/logout", { method: "POST" });
        app.classList.add("hidden");
        gate.classList.remove("hidden");
        document.getElementById("code").value = "";
        setMsg(gateMsg, "");
        setMsg(vocabMsg, "");
      });

      tabVocab.addEventListener("click", () => showTab("vocab"));
      tabDiary.addEventListener("click", () => showTab("diary"));

      weeklyNew.addEventListener("change", async () => {
        setMsg(vocabMsg, "正在保存每周额度…");
        try {
          const data = await api("/api/vocab/settings", {
            method: "PUT",
            headers: jsonHeaders,
            body: JSON.stringify({ weeklyNew: Number(weeklyNew.value) }),
          });
          renderVocab(data);
          setMsg(vocabMsg, "以后每周按这个数量安排新词。今天已抽出的词会保留。");
        } catch (error) {
          setMsg(vocabMsg, error.message, true);
        }
      });

      sentence.addEventListener("input", updateCount);
      updateCount();

      loadState().catch((error) => {
        if (error.status !== 401) setMsg(gateMsg, error.message, true);
      });
    </script>
  </body>
</html>
